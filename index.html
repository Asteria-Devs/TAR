<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booked</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      color: black;
    }

    .video-background {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -3;
      overflow: hidden;
    }

    .video-background iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 2rem;
    }

    /* White highlight background for all text inside .content */
    .content, .content * {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      padding: 0.2em 0.5em;
      display: inline;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      background: none;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
    }

    .button {
      background: rgba(255, 255, 255, 0.8);
      color: black;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .button:hover {
      background: rgba(0, 0, 0, 0.8);
      color: white;
    }
  </style>
</head>
<body>

<div class="video-background">
  <iframe
    src="https://www.youtube.com/embed/atjAURP2_9o?autoplay=1&mute=1&loop=1&playlist=atjAURP2_9o&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&fs=0"
    title="YouTube video"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>
</div>

<div class="content">
  <h1>Welcome</h1>
  <p>Good books, Good food, Good life.</p>
 
  <div class="button-container">
    <a href="menu.html" class="button">Press Release</a>
    <a href="ava.html" class="button">Invitations</a>
    <a href="aboutus.html" class="button">Letter to sponsors</a>
    <!-- New buttons below -->
    <a href="PR.html" class="button">Pr disaster</a>
    <a href="event.html" class="button">Future plans</a>
  </div>
</div>

</body>
</html>
